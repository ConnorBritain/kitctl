name: Release
# Tag-driven release: push a tag like v0.1.0rc1 (PEP 440). Each publish job runs in a
# GitHub environment (testpypi, pypi, npm); configure required reviewers on those
# environments so every publish waits for an explicit approval.
#
# Dry run: a manual dispatch, or a branch push that changes release mechanics, runs
# verify, the CI matrix, build, and install-smoke on 3 OSes; every publish job is skipped
# because publishing requires a v* tag ref.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/version.py"
      - "scripts/prepare_npm.py"
      - "scripts/release_notes.py"
      - "npm/**"
      - "pyproject.toml"
      - "src/kitctl/__init__.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pep440: ${{ steps.version.outputs.pep440 }}
      semver: ${{ steps.version.outputs.semver }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag, version, and changelog agree
        id: version
        run: |
          uv run --no-project python scripts/version.py --check
          uv run --no-project python scripts/version.py --github-output
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"
          else version="$(uv run --no-project python scripts/version.py | sed 's/^pep440=\([^ ]*\).*/\1/')"; fi
          uv run --no-project python scripts/release_notes.py "$version" > /dev/null

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv build
      - run: uv run --no-project python scripts/prepare_npm.py
      - run: npm pack
        working-directory: npm
      - run: mv npm/kitctl-*.tgz dist/
      - run: sha256sum dist/* | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  install-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sandbox HOME for smoke runs
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "SANDBOX=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - name: uv tool install
        run: |
          uv tool install dist/kitctl-*.whl
          HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl --version
          HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl doctor
          uv tool uninstall kitctl
      - name: pipx install
        run: |
          pipx install dist/kitctl-*.whl
          HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl --version
          HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl doctor
          pipx uninstall kitctl
      - name: npm tarball (uv on PATH)
        run: |
          npm install -g dist/kitctl-*.tgz
          HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl --version
          HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl doctor
      - name: npm tarball (Python fallback, no uv)
        run: |
          KITCTL_LAUNCHER_NO_UV=1 HOME="$SANDBOX" USERPROFILE="$SANDBOX" kitctl --version

  dry-run-summary:
    needs: [verify, test, install-smoke]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Dry run of ${{ needs.verify.outputs.pep440 }} passed: verify, CI, build," \
            "install-smoke. Nothing was published (publishing needs a v* tag)." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  publish-testpypi:
    needs: [verify, test, install-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - run: mkdir dist && cp artifacts/*.whl artifacts/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: [verify, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Install from TestPyPI (retries while the index updates)
        env:
          VERSION: ${{ needs.verify.outputs.pep440 }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if uvx --no-cache --index-url https://test.pypi.org/simple/ \
                --from "kitctl==$VERSION" kitctl --version; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1

  publish-pypi:
    needs: [verify, verify-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - run: mkdir dist && cp artifacts/*.whl artifacts/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: [verify, publish-pypi]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm with trusted-publishing support (npm 11.5.1+)
        run: npm install -g npm@latest
      - name: Publish (dist-tag ${{ needs.verify.outputs.npm_tag }})
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Prefer npm trusted publishing (OIDC, configured on npmjs.com for this repo and
          # release.yml). Fall back to an NPM_TOKEN secret only if one is set.
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          npm publish artifacts/kitctl-*.tgz --access public --provenance \
            --tag "${{ needs.verify.outputs.npm_tag }}"

  verify-public:
    needs: [verify, publish-npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install from PyPI and npm, then smoke test
        env:
          VERSION: ${{ needs.verify.outputs.pep440 }}
          SEMVER: ${{ needs.verify.outputs.semver }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"; export HOME_SANDBOX="$RUNNER_TEMP/home"
          for attempt in 1 2 3 4 5 6; do
            if uvx --no-cache --from "kitctl==$VERSION" kitctl --version; then break; fi
            [ "$attempt" = 6 ] && exit 1; sleep $((attempt * 10))
          done
          HOME="$HOME_SANDBOX" USERPROFILE="$HOME_SANDBOX" uvx --from "kitctl==$VERSION" kitctl doctor
          for attempt in 1 2 3 4 5 6; do
            if npx -y "kitctl@$SEMVER" --version; then break; fi
            [ "$attempt" = 6 ] && exit 1; sleep $((attempt * 10))
          done

  github-release:
    needs: [verify, verify-public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.pep440 }}
        run: |
          python3 scripts/release_notes.py "$VERSION" > notes.md
          flags=""
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "kitctl $VERSION" \
            --notes-file notes.md $flags
