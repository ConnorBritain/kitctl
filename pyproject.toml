[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kitctl"
version = "0.0.1"
description = "Inventory and manage agent skills, MCP connectors, hooks, and loadouts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Connor England" }]
keywords = ["agents", "claude", "codex", "skills", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "ruamel-yaml>=0.18.10,<0.19",
    "tomlkit>=0.13.2,<0.14",
]

[project.scripts]
kitctl = "kitctl.cli:main"

[project.urls]
Repository = "https://github.com/ConnorBritain/kitctl"
Issues = "https://github.com/ConnorBritain/kitctl/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
