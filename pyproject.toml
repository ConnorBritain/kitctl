[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kitctl"
dynamic = ["version"]
description = "Inventory and manage agent skills, MCP connectors, hooks, and loadouts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Connor England" }]
keywords = ["agents", "claude", "codex", "skills", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
kitctl = "kitctl.cli:main"

[project.urls]
Repository = "https://github.com/ConnorBritain/kitctl"
Issues = "https://github.com/ConnorBritain/kitctl/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "jsonschema>=4.23,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/kitctl/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = ["src/kitctl/_vendor/"]

[[tool.mypy.overrides]]
module = "kitctl._vendor.*"
follow_imports = "skip"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/kitctl/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
